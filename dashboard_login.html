<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuditIQ — Dashboard Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: #080C12; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: #0E1420; border: 1px solid #1E2D45; border-radius: 24px; padding: 48px; width: 100%; max-width: 420px; text-align: center; }
.logo { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; color: white; margin-bottom: 6px; }
.logo span { color: #00E5A0; }
.badge { display: inline-block; background: #00E5A0; color: #000; padding: 3px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
.subtitle { font-size: 13px; color: #6B7A99; margin-bottom: 32px; }
.form-group { margin-bottom: 16px; text-align: left; }
.form-group label { display: block; font-size: 13px; color: #6B7A99; margin-bottom: 6px; }
.form-group input { width: 100%; background: #141C2E; border: 1px solid #1E2D45; border-radius: 10px; padding: 13px 16px; font-size: 14px; color: #E8EDF5; outline: none; font-family: 'DM Sans', sans-serif; transition: border-color 0.2s; }
.form-group input:focus { border-color: #00E5A0; }
.btn { width: 100%; background: #00E5A0; color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; font-family: 'DM Sans', sans-serif; margin-top: 8px; transition: all 0.2s; }
.btn:hover { background: #00ffb3; }
.btn:disabled { background: #1E2D45; color: #6B7A99; cursor: not-allowed; }
.msg { margin-top: 14px; padding: 12px 16px; border-radius: 8px; font-size: 13px; display: none; }
.msg.error { background: rgba(255,64,96,0.1); border: 1px solid rgba(255,64,96,0.2); color: #FF4060; }
.back { margin-top: 20px; font-size: 13px; color: #6B7A99; }
.back a { color: #00E5A0; text-decoration: none; }
hr { border: none; border-top: 1px solid #1E2D45; margin: 24px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Audit<span>IQ</span></div>
  <div class="badge">Dashboard Access</div>
  <p class="subtitle">Delight Services</p>
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="Enter your email" onkeydown="if(event.key==='Enter') doLogin()">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter your password" onkeydown="if(event.key==='Enter') doLogin()">
  </div>
  <button class="btn" id="loginBtn" onclick="doLogin()">Sign In to Dashboard</button>
  <div class="msg error" id="errMsg"></div>
  <hr>
  <p class="back"><a href="/login">← Back to AuditIQ</a></p>
</div>
<script>
async function doLogin() {
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  if (!email || !password) { showErr('Please enter your email and password'); return; }
  var btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    var res = await fetch('/dashboard/login', { method: 'POST', body: new URLSearchParams({ email: email, password: password }), credentials: 'include' });
    var data = await res.json();
    if (!res.ok) { showErr(data.detail || 'Invalid credentials'); btn.disabled = false; btn.textContent = 'Sign In to Dashboard'; }
    else { if (data.token) localStorage.setItem('auditiq_session', data.token); window.location.href = '/dashboard?token=' + data.token; }
  } catch(e) { showErr('Error: ' + e.message); btn.disabled = false; btn.textContent = 'Sign In to Dashboard'; }
}
function showErr(msg) { var el = document.getElementById('errMsg'); el.textContent = msg; el.style.display = 'block'; }
</script>
</body>
</html>
